<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>会议助手</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo brand-logo--blue" id="brand-logo-slot"></div>
        <div class="brand-text-wrap">
          <span class="brand-text">会议助手</span>
          <span class="brand-sub">AI 驱动</span>
        </div>
      </div>

      <div class="sidebar-nav-wrap">
        <nav class="sidebar-nav" id="main-nav"></nav>
        <div class="sidebar-recent" id="sidebar-recent"></div>
      </div>

      <div class="sidebar-ai sync-card">
        <div class="sync-card-head">
          <span class="icon icon-sm" id="sparkles-icon"></span>
          <span class="sync-card-title">AI 智能功能</span>
        </div>
        <span class="sync-card-desc">语音转写 · 智能摘要 · 自动提醒</span>
      </div>

      <div class="sidebar-user">
        <div class="sidebar-user-card">
          <div class="user-avatar user-avatar--sm">张</div>
          <div class="sidebar-user-info">
            <span class="sidebar-user-name">张三</span>
            <span class="sidebar-user-role">管理员</span>
          </div>
          <span class="icon icon-sm" id="settings-icon-slot"></span>
        </div>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar" id="topbar">
        <div class="topbar-search-wrap">
          <div class="search-box">
            <span class="icon icon-sm" id="search-icon-slot"></span>
            <input type="search" id="global-search" placeholder="搜索会议、事项…" />
          </div>
        </div>
        <div class="topbar-right">
          <div class="topbar-notify-wrap" id="notify-wrap">
            <button type="button" class="icon-btn icon-btn--notify" id="btn-notify" title="最近提醒" aria-expanded="false">
              <span class="notify-btn-icon icon" id="notify-bell-slot" aria-hidden="true"></span>
              <span class="notify-badge" id="notify-badge" hidden></span>
            </button>
            <div class="notify-dropdown" id="notify-dropdown" aria-hidden="true" hidden></div>
          </div>
          <div class="user-avatar user-avatar--sm" title="张三">张</div>
        </div>
      </header>
      <main class="main-content" id="main-content"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-container" class="toast-container"></div>

  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/meeting.js"></script>
  <script src="js/pages/todos.js"></script>
  <script src="js/pages/team.js"></script>
  <script src="js/pages/records.js"></script>
  <script src="js/pages/trash.js"></script>
  <script src="js/pages/insights.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
